##############################################################################
#  render.yaml — Render Blueprint for bha-cst (Customer Service Twin)
#
#  Docs: https://render.com/docs/blueprint-spec
#
#  Services defined:
#    1. bha-cst          — Node.js web service (Express + TypeScript)
#    2. bha-cst-postgres — Managed PostgreSQL 16 database
#
#  Deployment & Environment Variables:
#    - All environment variable values are loaded from your .env file via the
#      Render Dashboard (Environment → "Add from .env" or manual entry).
#    - No environment values are hardcoded in this YAML (all marked sync: false).
#    - DATABASE_URL is auto-wired from the managed PostgreSQL service below.
##############################################################################

databases:
  - name: bha-cst-postgres
    databaseName: bha_cst
    user: bha_cst_user
    # NOTE: Free-tier databases hibernate after inactivity and delete after 90 days.
    # Upgrade to 'starter' or higher for production persistence and continuous uptime.
    plan: starter          # Change to 'starter' for production
    region: oregon      # Match your web service region
    postgresMajorVersion: 16

services:
  - type: web
    name: bha-cst
    runtime: node
    region: oregon

    # ── Build ─────────────────────────────────────────────────────────────────
    buildCommand: npm ci --include=dev && cd cst-twin && npm ci && cd .. && npm run build

    # ── Database Migrations & Start ───────────────────────────────────────────
    # On free tier, preDeployCommand is not supported by Render, so database
    # migrations run right before the server starts in startCommand.
    startCommand: node scripts/migrate.js && (cd cst-twin && npm start &) && npm start

    # ── Health Check ─────────────────────────────────────────────────────────
    healthCheckPath: /health

    # ── Scaling & Deployment ──────────────────────────────────────────────────
    plan: free           # production (0.5c-512mb) — matches observed Render service
    autoDeploy: true     # Re-deploy automatically on git push to the branch

    # ── Environment Variables ─────────────────────────────────────────────────
    # ALL values come exclusively from your .env file.
    # No values are defined in this YAML (sync: false ensures Render sources
    # them from the dashboard environment settings / .env upload).
    envVars:
      # --- Database Connection (from Render Postgres service above) ---
      - key: DATABASE_URL
        fromDatabase:
          name: bha-cst-postgres
          property: connectionString

      # --- Server & Runtime ---
      - key: PORT
        sync: false

      - key: NODE_ENV
        sync: false

      # --- Twilio Transport Credentials ---
      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false

      # --- System #1 (vFarm) Identity & Routing ---
      - key: VFARM_SYSTEM_ID
        sync: false

      - key: VFARM_TENANT_ID
        sync: false

      - key: VFARM_TENANT_NAME
        sync: false

      - key: VFARM_SYSTEM_NAME
        sync: false

      - key: VFARM_PHONE_NUMBERS
        sync: false

      - key: VFARM_ONBOARDING_REPLY
        sync: false

      # --- vFarm External API Seams ---
      - key: VFARM_RESOLVE_ENDPOINT
        sync: false

      - key: VFARM_RESOLVE_API_KEY
        sync: false

      # --- vFarm Live API & Credentials ---
      - key: VFARM_BASE_URL
        sync: false

      - key: VFARM_API_BASE_URL
        sync: false

      - key: VFARM_JWT
        sync: false

      - key: VFARM_API_JWT
        sync: false

      - key: VFARM_FARM_KEY
        sync: false

      - key: VFARM_API_FARM_KEY
        sync: false

      - key: VFARM_API_KEY
        sync: false

      - key: VFARM_API_TOKEN
        sync: false

      - key: VFARM_API_TIMEOUT_MS
        sync: false

      - key: VFARM_FARM_ID
        sync: false

      - key: VFARM_ADMIN_EMAIL
        sync: false

      - key: VFARM_ADMIN_PASSWORD
        sync: false

      - key: VFARM_ADMIN_PHONE
        sync: false

      - key: VFARM_TENANT_ORG_ID
        sync: false

      - key: VFARM_TENANT_ORG_ID_MAIN
        sync: false

      - key: VFARM_PROJECT_ID_MAIN
        sync: false

      - key: VFARM_PROJECT_NAME_MAIN
        sync: false

      - key: VFARM_WORKSPACE_ID
        sync: false

      - key: VFARM_DEFAULT_FARM_NAME
        sync: false

