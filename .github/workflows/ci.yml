name: CST Continuous Integration

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Typecheck, Build & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bha_cst
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Environment Configuration
        run: cp .env.example .env

      - name: Run PostgreSQL Schema Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bha_cst
        run: npm run db:migrate

      - name: TypeScript Compilation Check
        run: npm run typecheck

      - name: Project Build
        run: npm run build

      - name: Execute Vitest Test Suites
        run: npm test

      - name: Execute Real PostgreSQL Integration Suites
        env:
          CST_DB_TESTS: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bha_cst
        run: npx vitest run tests/interfaces/iwkx_persistence.test.ts tests/escalation/escalation_service.test.ts tests/db/db_client_persistence.test.ts tests/db/conversation_fk_integrity.test.ts tests/db/schema_assertions.test.ts tests/transport/delivery_persistence.test.ts

